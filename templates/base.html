{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>{% block title %}Bang Onsen Spa & Resort – Tắm Onsen Quảng Trị{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Đặt vé Bang Onsen online 24/7: trải nghiệm tắm Onsen, suối khoáng nóng 105°C chuẩn Nhật Bản tại Quảng Trị. Xem bảng giá vé, chọn ngày và nhận vé QR qua email trong 2 phút.{% endblock %}">
  <meta name="robots" content="{% block meta_robots %}index,follow{% endblock %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  {% block extra_css %}{% endblock %}
  {% block structured_data %}{% endblock %}
</head>
<body>
  {% block layout %}{% endblock %}
  {% block extra_js %}{% endblock %}
</body>
</html>
